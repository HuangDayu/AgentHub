plugins {
    id 'org.springframework.boot' version '4.1.0-M2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

ext {
    springCloudVersion = '2025.1.1'
    pmdToolVersion = '6.55.0'
    p3cVersion = '2.1.1'
    jacocoToolVersion = '0.8.13'
    mybatisPlusVersion = '3.5.16'
    openfeignVersion = '13.6'
    springBootVersion = '4.1.0-M2'
    springAiVersion = '2.0.0-M4'
    archUnitVersion = '1.3.0'
    grpcVersion = '1.59.1'
    langchain4jVersion = '1.14.0'
    embabelAgentVersion = '0.4.0-SNAPSHOT'
    hutoolVersion = '5.8.31'
    springAiAlibabaVersion = '1.1.2.0'
    agentscopeVersion = '1.1.0-RC2'
    apacheCamelVersion = '4.14.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}

configurations.all {
    resolutionStrategy {
        force "io.grpc:grpc-api:${grpcVersion}"
        force "io.grpc:grpc-core:${grpcVersion}"
        force "io.grpc:grpc-netty:${grpcVersion}"
        force "io.grpc:grpc-netty-shaded:${grpcVersion}"
        force "io.grpc:grpc-protobuf:${grpcVersion}"
        force "io.grpc:grpc-stub:${grpcVersion}"
        force "io.grpc:grpc-util:${grpcVersion}"
        force "io.grpc:grpc-protobuf-lite:${grpcVersion}"
    }
}

dependencies {
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
    implementation platform("dev.langchain4j:langchain4j-bom:${langchain4jVersion}")
    implementation platform("cn.hutool:hutool-bom:${hutoolVersion}")
    implementation platform("com.alibaba.cloud.ai:spring-ai-alibaba-bom:${springAiAlibabaVersion}")
    implementation platform("com.alibaba.cloud.ai:spring-ai-alibaba-extensions-bom:${springAiAlibabaVersion}")
    implementation(platform("org.apache.camel:apache-camel:${apacheCamelVersion}"))


    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.security:spring-security-crypto'

    implementation 'com.alibaba.cloud.ai:spring-ai-alibaba-agent-framework'
    implementation "io.agentscope:agentscope-core:${agentscopeVersion}"
    implementation "io.agentscope:agentscope-harness:${agentscopeVersion}"
    implementation "io.agentscope:agentscope-extensions-studio:${agentscopeVersion}"

    implementation "com.baomidou:mybatis-plus-spring-boot4-starter:${mybatisPlusVersion}"
    implementation "com.baomidou:mybatis-plus-jsqlparser:${mybatisPlusVersion}"
    implementation "com.baomidou:mybatis-plus-extension:${mybatisPlusVersion}"
    implementation 'org.postgresql:postgresql'
    implementation 'io.minio:minio:8.5.17'
    implementation 'co.elastic.clients:elasticsearch-java:8.17.2'
    implementation 'org.elasticsearch.client:elasticsearch-rest-high-level-client:7.17.27'

    implementation 'io.modelcontextprotocol.sdk:mcp:1.1.0'
    implementation 'org.apache.camel:camel-core'
    implementation 'org.apache.camel:camel-main'
    implementation 'org.apache.camel:camel-direct'
    implementation 'org.apache.camel:camel-timer'
    implementation 'org.apache.camel:camel-bean'
    implementation 'org.apache.camel:camel-jdbc'
    implementation 'org.apache.camel:camel-http'
    implementation 'org.apache.camel:camel-file'
    implementation 'org.apache.camel:camel-mail'
    implementation 'org.apache.camel:camel-mongodb'
    implementation 'org.apache.camel:camel-redis'
    implementation 'org.apache.camel:camel-sql'
    implementation 'org.apache.camel:camel-rest'

    implementation 'org.springframework.ai:spring-ai-mcp'
    implementation 'org.springframework.ai:spring-ai-ollama'
    implementation 'org.springframework.ai:spring-ai-openai'
    implementation 'org.springframework.ai:spring-ai-model'
    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.ai:spring-ai-qdrant-store'
    implementation 'org.springframework.ai:spring-ai-milvus-store'
    implementation 'org.springframework.ai:spring-ai-weaviate-store'
    implementation 'org.springframework.ai:spring-ai-chroma-store'
    implementation 'org.springframework.ai:spring-ai-pgvector-store'
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
    implementation 'org.springframework.ai:spring-ai-rag'
    implementation 'org.springframework.ai:spring-ai-tika-document-reader'
    implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client-webflux'

    implementation 'cn.hutool:hutool-core'
    implementation 'cn.hutool:hutool-cache'
    implementation 'cn.hutool:hutool-json'
    implementation 'com.alibaba:transmittable-thread-local:2.14.4'
    implementation "jakarta.servlet:jakarta.servlet-api"
    implementation 'org.aspectj:aspectjweaver:1.9.22.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.security:spring-security-crypto:6.4.4'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.jgrapht:jgrapht-core:1.5.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    compileOnly "org.projectlombok:lombok:1.18.46"
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    testCompileOnly "org.projectlombok:lombok:1.18.46"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.46"
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
    testImplementation 'ch.qos.logback:logback-classic'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archUnitVersion}"
    testRuntimeOnly 'com.h2database:h2:2.2.224'
}

tasks.register('generateViolations', JavaExec) {
    group = 'verification'
    description = '扫描所有方法违规并输出 TSV/JSON'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.agenthub.test.architecture.MethodViolationDumper'
}

tasks.register('generateExemptions', JavaExec) {
    group = 'verification'
    description = '从 method-violations.json 生成 architecture-exemptions.json'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.agenthub.test.architecture.ExemptionGenerator'
}

tasks.register('generateSchemaDdl', JavaExec) {
    group = 'verification'
    description = '扫描 entity 包，按方言（postgres/h2/mysql）生成 sql/{dialect}/{schema.sql,init.sql}'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.agenthub.test.schema.SchemaFileGeneratorCli'
    args = ['sql']
}

tasks.named('test') { dependsOn 'generateSchemaDdl' }


repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://repo.spring.io/milestone' }
    maven { url = 'https://repo.spring.io/snapshot' }
    maven {
        name = 'embabel-releases'
        url = 'https://repo.embabel.com/artifactory/libs-release'
        mavenContent {
            releasesOnly()
        }
    }
    maven {
        name = 'embabel-snapshots'
        url = 'https://repo.embabel.com/artifactory/libs-snapshot'
        mavenContent {
            snapshotsOnly()
        }
    }
    maven {
        name = 'Spring Milestones'
        url = 'https://repo.spring.io/milestone'
    }
}
