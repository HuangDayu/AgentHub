plugins {
    id 'org.springframework.boot' version '4.1.0-M2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

ext {
    springCloudVersion = '2025.1.1'
    pmdToolVersion = '6.55.0'
    p3cVersion = '2.1.1'
    jacocoToolVersion = '0.8.13'
    mybatisPlusVersion = '3.5.16'
    openfeignVersion = '13.6'
    springBootVersion = '4.1.0-M2'
    springAiVersion = '2.0.0-M4'
    archUnitVersion = '1.3.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.retry:spring-retry:2.0.11'

    implementation "com.baomidou:mybatis-plus-spring-boot4-starter:${rootProject.ext.mybatisPlusVersion}"
    implementation "com.baomidou:mybatis-plus-jsqlparser:${rootProject.ext.mybatisPlusVersion}"
    implementation "com.baomidou:mybatis-plus-extension:${rootProject.ext.mybatisPlusVersion}"
    implementation 'org.postgresql:postgresql'
    implementation 'org.apache.tika:tika-core:2.9.1'
    implementation 'org.apache.tika:tika-parsers-standard-package:2.9.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'io.minio:minio:8.5.17'
    implementation 'co.elastic.clients:elasticsearch-java:8.17.2'
    implementation 'org.elasticsearch.client:elasticsearch-rest-high-level-client:7.17.27'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0-M4')
    implementation 'org.springframework.ai:spring-ai-ollama'
    implementation 'org.springframework.ai:spring-ai-openai'
    implementation 'org.springframework.ai:spring-ai-model'
    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.ai:spring-ai-qdrant-store'
    implementation 'org.springframework.ai:spring-ai-milvus-store'
    implementation 'org.springframework.ai:spring-ai-weaviate-store'
    implementation 'org.springframework.ai:spring-ai-chroma-store'
    implementation 'org.springframework.ai:spring-ai-pgvector-store'
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'


    implementation 'com.alibaba:transmittable-thread-local:2.14.4'
    implementation "jakarta.servlet:jakarta.servlet-api"
    implementation 'org.springframework.security:spring-security-crypto:6.4.4'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'

    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
    testImplementation 'ch.qos.logback:logback-classic'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation "com.tngtech.archunit:archunit-junit5:${rootProject.ext.archUnitVersion}"
}


repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/milestone' }
    maven { url = 'https://repo.spring.io/snapshot' }
}
