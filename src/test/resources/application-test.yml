server:
  port: 0

spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  sql:
    init:
      mode: never
      schema-locations: file:${user.dir}\sql\schema.sql
      data-locations: file:${user.dir}\sql\init.sql
      platform: postgresql
  datasource:
    url: jdbc:postgresql://localhost:5432/agenthub?schema=app
    username: things
    password: things123
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: app
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2MB
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  mail:
    host: localhost
    port: 25
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:a5554de4c86b48898f37bfe707a6b9a5.6cxppk3EjHa9YeD8W7BEavhM}
      base-url: https://ollama.com
      embedding:
        base-url: http://127.0.0.1:9090
        options:
          model: qwen3-embedding
      chat:
        options:
          model: nemotron-3-super:cloud
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: document_chunks
        initialize-schema: true
    model:
      embedding: openai
      chat: openai
    retry:
      backoff:
        initial-interval: 20000ms
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  http:
    clients:
      connect-timeout: 60000
      read-timeout: 300000

mybatis-plus:
  type-handlers-package: com.agenthub.infrastructure.store.db.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

agenthub:
  jwt:
    secret: monolith-dev-secret-key-please-change-in-production-2026
    expiration: 3600000
  storage:
    provider: minio
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: agenthub
  rag:
    impl-type: spring
    reranker:
      type: keyword
  etl:
    impl-type: spring

# JWT
jwt.secret: monolith-dev-secret-key-please-change-in-production-2026

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.agenthub: DEBUG
    org.springframework.security: WARN
