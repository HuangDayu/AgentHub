server:
  port: 8088

spring:
  application:
    name: knowledge-domain
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  sql:
    init:
      mode: always
      schema-locations: file:${user.dir}\sql\schema.sql
      platform: postgresql
  datasource:
    url: jdbc:postgresql://localhost:5432/agenthub
    username: things
    password: things123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2MB
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  mail:
    host: localhost
    port: 25
    retry:
      backoff:
        initial-interval: 20000ms
  http:
    clients:
      connect-timeout: 60000
      read-timeout: 300000
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

mybatis-plus:
  type-handlers-package: com.agenthub.infrastructure.persistence.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

agenthub:
  deployment:
    mode: monolith
  jwt:
    secret: monolith-dev-secret-key-please-change-in-production-2026
    expiration: 3600000
  storage:
    provider: minio
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: agenthub
  persistence:
    mode: mybatis
  text-search:
    enabled: false
  query-rewrite:
    llm:
      enabled: false
  remote:
    model-gateway:
      enabled: false
    retrieval:
      enabled: false
  reranker:
    cross-encoder:
      enabled: false

# JWT
jwt.secret: monolith-dev-secret-key-please-change-in-production-2026

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.agenthub: DEBUG
    org.springframework.security: WARN